name: Browser compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Exercise shared trace and Eval interactions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # One engine for PR feedback; main and manual runs keep full compatibility.
      BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
    defaults:
      run:
        working-directory: test/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked portable tool dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugin/portable-tools
      - run: npx --no-install playwright install --with-deps $BROWSERS
      - name: Run the selected browser checks
        run: node --test --test-name-pattern="${BROWSERS// /|}" smoke-test.mjs eval-host-test.mjs
