name: Browser compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Exercise trace interactions in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: test/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked portable tool dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugin/portable-tools
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm test
