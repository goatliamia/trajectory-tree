name: Native regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Exercise trace behavior and package contents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked portable tool dependencies
        run: npm ci --prefix plugin/portable-tools --ignore-scripts --no-audit --no-fund
      - name: Install the DSH definition reader used by native report tests
        run: npm install --prefix . --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-token-meter@0.2.2-rc.3
      - name: Check shared assets and host skills are synchronized
        run: |
          node scripts/sync-view-assets.mjs --check
          node scripts/sync-inspect-models.mjs --check
          node scripts/sync-host-skills.mjs --check
      - name: Run synthetic observations and actual package loading
        run: >-
          node --test
          plugin/analysis-view/goal-events-test.mjs
          plugin/analysis-view/stages-test.mjs
          plugin/analysis-view/resources-test.mjs
          plugin/analysis-view/overview-cache-test.mjs
          lib/context-diagnosis-test.mjs
          analyzers/context-overlap-test.mjs
          plugin/trajectory-tools/inspect-test.mjs
          plugin/trajectory-tools/diagnosis-test.mjs
      - name: Smoke test host adapters, language and presentation
        run: >-
          node --test
          analyzers/host-self-test.mjs
          analyzers/pi-adapter-test.mjs
          analyzers/codex-adapter-test.mjs
          analyzers/claude-adapter-test.mjs
          analyzers/claude-hook-test.mjs
          analyzers/claude-host-test.mjs
          view/assets/pi-host-test.mjs
          view/assets/codex-host-test.mjs
          lib/i18n-test.mjs
          plugin/analysis-view/self-test.mjs
          plugin/analysis-view/eval-test.mjs
          plugin/analysis-view/code-execution-test.mjs
          plugin/analysis-view/findings-test.mjs
          plugin/analysis-view/overview-test.mjs
          plugin/analysis-view/search-test.mjs
          plugin/trajectory-tools/request-context-test.mjs
          experiments/corpus/acceptance-eval-test.mjs
          plugin/analysis-view/presentation-test.mjs
          docs/demo/layout-review/geist-interaction-test.mjs
          view/test.mjs
          report/smoke-test.mjs
          report/test.mjs
          report/eval-test.mjs
          report/flow-test.mjs
      - name: Exercise the portable evidence tools and transports
        run: npm test --prefix plugin/portable-tools
      - name: Build the three host packages and load their entrypoints
        run: |
          for host in codex pi claude
          do
            node scripts/package-trajectory.mjs --host "$host"
            node "dist/trajectory-tree-$host/scripts/trajectory-view.mjs" --help
          done
